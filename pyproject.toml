[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "enose-drift-mcu"
version = "0.1.0"
description = "Drift compensation and calibration transfer for gas sensor arrays under microcontroller memory and time budgets"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = ["numpy>=1.22", "scipy>=1.9", "scikit-learn>=1.3"]

[project.optional-dependencies]
dev = ["pytest>=7.0", "matplotlib>=3.5"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
