; E5 firmware. Board settings follow lut-kan-native (MIT) so that the same
; Mega2560 / ESP32-C3 / ESP32-S3 units and clocks are used.
[platformio]
default_envs = mega2560, esp32c3, esp32s3

[env]
framework = arduino
monitor_speed = 115200
build_flags = -fno-fast-math -ffp-contract=off
build_src_filter = +<*> -<hil/>

[env:mega2560]
platform = atmelavr@5.1.0
board = megaatmega2560
upload_speed = 115200

[env:esp32c3]
platform = espressif32@6.12.0
board = esp32-c3-devkitm-1
board_build.f_cpu = 160000000L
upload_speed = 460800
build_flags = ${env.build_flags} -DARDUINO_USB_CDC_ON_BOOT=0 -DARDUINO_USB_MODE=1

; ESP32-S3 FH4R2, 4 MB flash, native USB Serial/JTAG, 240 MHz, PSRAM unused.
[env:esp32s3]
platform = espressif32@6.12.0
board = esp32-s3-devkitc-1
board_build.f_cpu = 240000000L
board_build.f_flash = 80000000L
board_build.flash_mode = dio
board_build.arduino.memory_type = dio_qspi
board_build.partitions = default.csv
board_upload.flash_size = 4MB
board_upload.maximum_size = 4194304
upload_speed = 460800
build_flags = ${env.build_flags} -DARDUINO_USB_CDC_ON_BOOT=0 -DARDUINO_USB_MODE=1

; E7 (revision): complete streams sent by the host (hil/hil_main.cpp).
[env:mega2560_hil]
extends = env:mega2560
build_src_filter = +<hil/>

[env:esp32c3_hil]
extends = env:esp32c3
build_src_filter = +<hil/> +<usb_bench_phy.c>

[env:esp32s3_hil]
extends = env:esp32s3
build_src_filter = +<hil/> +<usb_bench_phy.c>
